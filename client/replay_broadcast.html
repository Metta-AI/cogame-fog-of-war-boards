<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fog-of-War Boards — Replay</title>
<link rel="stylesheet" href="/client/chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">FOG<span>BOARDS</span></div>
      <div id="clock">PLY 0</div>
      <div id="topright">
        <span id="statuschip">replay</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<div id="loading">LOADING REPLAY…</div>
<script src="/client/chrome_common.js"></script>
<script src="/client/renderer.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  FogRenderer.bindFeedToggle(document.getElementById("feedtoggle"), true);
  var scheme = location.protocol === "https:" ? "wss://" : "ws://";
  var socket = new WebSocket(scheme + location.host + "/replay");
  socket.onmessage = function (frame) {
    var payload = JSON.parse(frame.data);
    if (payload.type !== "replay") return;
    document.getElementById("loading").style.display = "none";
    fit();
    FogRenderer.attachReplay({
      canvas: canvas,
      feed: document.getElementById("feed"),
      scrub: document.getElementById("scrub"),
      playButton: document.getElementById("play"),
      label: document.getElementById("pos"),
      clock: document.getElementById("clock"),
      scorebug: document.getElementById("scorebug"),
      endscreen: document.getElementById("endscreen"),
      assetBase: "/client/assets",
      payload: payload
    });
    socket.onmessage = null;
  };
  socket.onerror = function () {
    document.getElementById("loading").textContent = "REPLAY FAILED TO LOAD";
  };
</script>
<!-- ============================================================
     fog-of-war-boards additions to the inherited cogame-babel chrome.
     Everything above this line is cogame-babel's page, copied byte for
     byte and renamed; no starter element is removed. The truth board and
     both belief boards are three viewports inside the existing
     canvas#table, so nothing is spliced into #board-wrap.
     ============================================================ -->
<script>
  // The game's own feed sentences and endcard columns are registered with
  // the inherited chrome by client/renderer.js the moment a driver
  // attaches; this block only publishes the transport metrics the CSS
  // consumes, so the endcard stops at the top of the transport band.
  FogChrome.relayout();
  window.addEventListener("resize", FogChrome.relayout);
</script>
</body>
</html>
